[project]
name = "mono-pub"
version = "0.1.0"
description = "Publish content for monointerferenz via Jekyll."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "jinja2>=3.1.6",
    "python-frontmatter>=1.3.0",
    "python-slugify>=8.0.4",
    "pyyaml>=6.0.3",
    "typer>=0.26.8",
]

[project.optional-dependencies]
tui = [
    "textual>=6.6.0",
]

[project.scripts]
mono-pub = "mono_pub.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mono_pub"]
